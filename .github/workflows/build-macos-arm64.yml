name: Build macOS arm64

on:
  workflow_dispatch:
  push:
    paths:
      - "WorkChatDockMac/**"
      - ".github/workflows/build-macos-arm64.yml"

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build Apple Silicon app
        id: build
        continue-on-error: true
        run: |
          chmod +x WorkChatDockMac/build-macos.sh
          set -o pipefail
          WorkChatDockMac/build-macos.sh 2>&1 | tee macos-build.log
      - name: Publish build diagnostics
        if: always()
        run: |
          {
            echo "## macOS arm64 build log"
            echo '```text'
            tail -n 240 macos-build.log 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if test "${{ steps.build.outcome }}" != "success"; then
            LOG="$(tail -n 180 macos-build.log 2>/dev/null || true)"
            LOG="${LOG//'%'/'%25'}"
            LOG="${LOG//$'\r'/'%0D'}"
            LOG="${LOG//$'\n'/'%0A'}"
            echo "::error title=macOS arm64 compiler output::$LOG"
          fi
          test "${{ steps.build.outcome }}" = "success"
      - uses: actions/upload-artifact@v4
        with:
          name: WorkChatDock-macOS-arm64
          path: WorkChatDockMac/dist/WorkChatDock-macOS-arm64.zip
